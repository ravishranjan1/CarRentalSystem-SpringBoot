<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify | Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        :root{
            --bg-main:#020617;
            --bg-card:#0b1220;
            --border-soft:rgba(255,255,255,0.08);
            --text-main:#e5e7eb;
            --text-muted:#94a3b8;
            --accent:#22c55e;
            --accent-soft:rgba(34,197,94,0.18);
            --info:#60a5fa;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        /* BODY BACKGROUND STATES */

        body{
            color:var(--text-main);
            min-height:100vh;
        }

        .default-bg{
            background:radial-gradient(circle at top,#111827,#020617);
        }

        .success-bg{
            background:radial-gradient(circle at top,#14532d,#020617);
        }

        .error-bg{
            background:radial-gradient(circle at top,#7f1d1d,#020617);
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        /* NAVBAR */

        .navbar{
            position:sticky;
            top:0;
            z-index:999;
            background:rgba(2,6,23,.85);
            backdrop-filter:blur(12px);
            padding:14px 26px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid var(--border-soft);
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .app-logo{
            width:42px;
            height:42px;
            border-radius:12px;
        }

        .logo h2{
            font-weight:900;
        }

        .logo span{
            color:var(--accent);
        }

        .nav-links a{
            font-size:13px;
            padding:10px 16px;
            border-radius:14px;
            background:rgba(255,255,255,0.05);
            font-weight:700;
            transition:.3s;
        }

        .nav-links a:hover{
            background:var(--accent-soft);
            color:var(--accent);
        }

        /* PAGE */

        .page-wrap{
            width:92%;
            max-width:520px;
            margin:50px auto;
        }

        /* CARD */

        .form-card{
            background:linear-gradient(180deg,#0b1220,#020617);
            border:1px solid var(--border-soft);
            border-radius:22px;
            padding:28px;
            box-shadow:0 25px 70px rgba(0,0,0,.6);
            position:relative;
            overflow:hidden;
        }

        .form-card::before{
            content:"";
            position:absolute;
            top:-60px;
            right:-60px;
            width:140px;
            height:140px;
            border-radius:50%;
            background:var(--accent-soft);
        }

        /* HEADER */

        .form-header{
            text-align:center;
            margin-bottom:20px;
            position:relative;
            z-index:2;
        }

        .form-header h2{
            font-size:24px;
            font-weight:900;
        }

        .form-header p{
            font-size:13px;
            color:var(--text-muted);
            margin-top:6px;
        }

        /* FORM */

        .form-row{
            margin-top:16px;
            position:relative;
            z-index:2;
        }

        label{
            display:block;
            font-weight:700;
            font-size:13px;
            color:var(--text-muted);
            margin-bottom:6px;
        }

        input{
            width:100%;
            padding:12px 14px;
            border-radius:14px;
            border:1px solid var(--border-soft);
            background:#020617;
            color:white;
            font-size:14px;
            outline:none;
            transition:.25s;
        }

        input:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 4px rgba(34,197,94,.15);
        }

        /* BUTTONS */

        .btn-row{
            margin-top:22px;
            display:flex;
            gap:10px;
            position:relative;
            z-index:2;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:16px;
            cursor:pointer;
            font-weight:900;
            font-size:14px;
            transition:.3s;
        }

        .btn-primary{
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:#022c16;
            box-shadow:0 12px 30px rgba(34,197,94,.35);
        }

        .btn-primary:hover{
            transform:translateY(-2px);
        }

        .btn-secondary{
            background:rgba(255,255,255,0.07);
            border:1px solid var(--border-soft);
            color:white;
        }

        .btn-secondary:hover{
            background:rgba(255,255,255,0.12);
        }

        /* MESSAGE */

        .message{
            padding:12px;
            border-radius:14px;
            margin-bottom:16px;
            font-size:14px;
            font-weight:600;
            text-align:center;
            position:relative;
            z-index:2;
        }

        .success{
            background:#dcfce7;
            color:#166534;
        }

        .error{
            background:#fee2e2;
            color:#991b1b;
        }

        /* FOOTER LINK */

        .back-link{
            text-align:center;
            margin-top:18px;
            font-size:13px;
            color:var(--text-muted);
            position:relative;
            z-index:2;
        }

        .back-link a{
            color:var(--info);
            font-weight:700;
        }

        /* MOBILE */

        @media(max-width:650px){

            .nav-links{
                display:none;
            }

            .page-wrap{
                margin-top:30px;
            }

        }

    </style>

</head>

<body th:classappend="${success != null} ? 'success-bg' : (${error != null} ? 'error-bg' : 'default-bg')">

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        <img src="/images/rentify.png" class="app-logo" alt="Rentify Logo">
        <h2>Rent<span>ify</span></h2>
    </div>

    <div class="nav-links">
        <a href="/rentify/">Dashboard</a>
    </div>

</div>

<!-- PAGE -->

<div class="page-wrap">

    <div class="form-card">

        <!-- SUCCESS MESSAGE -->

        <div th:if="${success}"
             class="message success"
             th:text="${success}">
        </div>

        <!-- ERROR MESSAGE -->

        <div th:if="${error}"
             class="message error"
             th:text="${error}">
        </div>

        <!-- HEADER -->

        <div class="form-header">
            <h2>Login Account</h2>
            <p>Enter your credentials to access Rentify</p>
        </div>

        <!-- FORM -->

        <form th:action="@{/rentify/login}"
              method="post">

            <div class="form-row">

                <label>Username</label>

                <input type="text"
                       name="username"
                       placeholder="Enter username"
                       required>

            </div>

            <div class="form-row">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required>

            </div>

            <!-- BUTTONS -->

            <div class="btn-row">

                <button type="submit"
                        class="btn btn-primary">
                    Login
                </button>

                <button type="reset"
                        class="btn btn-secondary">
                    Reset
                </button>

            </div>

        </form>

        <!-- REGISTER LINK -->

        <div class="back-link">

            Don't have an account ?

            <a th:href="@{/rentify/register}">
                Register Here
            </a>

        </div>

    </div>

</div>

</body>

</html>
