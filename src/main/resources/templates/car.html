<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Rentify | Cars
    </title>

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        :root{

            --bg-main:#020617;
            --bg-card:#0b1220;
            --border-soft:rgba(255,255,255,0.08);
            --text-main:#e5e7eb;
            --text-muted:#94a3b8;
            --accent:#22c55e;
            --accent-soft:rgba(34,197,94,0.18);
            --danger:#ef4444;
            --info:#60a5fa;
            --warning:#facc15;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        body{

            background:
                    radial-gradient(circle at top,
                    #111827,
                    #020617);

            color:var(--text-main);

            min-height:100vh;
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        /* NAVBAR */

        .navbar{

            position:sticky;
            top:0;
            z-index:999;

            background:rgba(2,6,23,.85);

            backdrop-filter:blur(12px);

            padding:14px 26px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            border-bottom:1px solid var(--border-soft);
        }

        .logo{

            display:flex;
            align-items:center;
            gap:10px;
        }

        .app-logo{

            width:42px;
            height:42px;
            border-radius:12px;
        }

        .logo h2{
            font-weight:900;
        }

        .logo span{
            color:var(--accent);
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .nav-links a{

            font-size:13px;

            padding:10px 16px;

            border-radius:14px;

            background:rgba(255,255,255,0.05);

            font-weight:700;

            transition:.3s;
        }

        .nav-links a:hover{

            background:var(--accent-soft);

            color:var(--accent);
        }

        /* CONTAINER */

        .container{

            width:92%;
            max-width:1350px;

            margin:24px auto;
        }

        /* HEADER */

        .page-head{

            margin-bottom:20px;
        }

        .page-head h1{

            font-size:32px;

            font-weight:900;
        }

        .page-head p{

            color:var(--text-muted);

            font-size:14px;

            margin-top:8px;
        }

        /* STATS */

        .stats{

            display:grid;

            grid-template-columns:
                    repeat(auto-fit,minmax(220px,1fr));

            gap:14px;

            margin-bottom:24px;
        }

        .stat-card{

            background:
                    linear-gradient(180deg,
                    #0b1220,
                    #020617);

            border:1px solid var(--border-soft);

            border-radius:20px;

            padding:18px;

            box-shadow:0 20px 60px rgba(0,0,0,.55);
        }

        .stat-card h3{

            color:var(--text-muted);

            font-size:13px;
        }

        .stat-card h2{

            font-size:30px;

            font-weight:900;

            margin-top:6px;
        }

        /* TOP BAR */

        .top-bar{

            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:14px;

            margin-bottom:18px;
        }

        .search-box{

            display:flex;
            align-items:center;
            gap:10px;

            background:#020617;

            border:1px solid var(--border-soft);

            padding:14px 16px;

            border-radius:16px;

            width:340px;
        }

        .search-box i{
            color:var(--text-muted);
        }

        .search-box input{

            background:transparent;

            border:none;

            outline:none;

            color:white;

            width:100%;
        }

        .search-box input::placeholder{
            color:#64748b;
        }

        .btn-primary{

            background:
                    linear-gradient(135deg,
                    #22c55e,
                    #16a34a);

            color:#022c16;

            padding:13px 20px;

            border-radius:16px;

            font-weight:900;

            border:none;

            cursor:pointer;

            transition:.3s;
        }

        .btn-primary:hover{

            transform:translateY(-2px);
        }

        /* ALERTS */

        .alert{

            padding:14px 16px;

            border-radius:16px;

            margin-bottom:16px;

            font-size:14px;

            font-weight:700;
        }

        .success{

            background:rgba(34,197,94,.15);

            color:var(--accent);
        }

        .error{

            background:rgba(239,68,68,.15);

            color:var(--danger);
        }

        /* TABLE */

        .table-wrap{

            background:
                    linear-gradient(
                    180deg,
                    #0b1220,
                    #020617);

            border:1px solid var(--border-soft);

            border-radius:24px;

            overflow-x:auto;
            overflow-y:hidden;

            box-shadow:0 20px 60px rgba(0,0,0,.55);

            width:100%;
        }

        .table-wrap::-webkit-scrollbar{

            height:8px;
        }

        .table-wrap::-webkit-scrollbar-thumb{

            background:#1e293b;

            border-radius:999px;
        }

        .table-wrap::-webkit-scrollbar-track{

            background:#020617;
        }

        table{

            width:100%;

            border-collapse:collapse;

            min-width:1200px;
        }

        th,
        td{

            padding:16px 14px;

            text-align:center;

            font-size:14px;

            white-space:nowrap;
        }

        th{

            background:#020617;

            color:var(--text-muted);

            font-weight:800;
        }

        tr{

            border-bottom:1px solid var(--border-soft);

            transition:.25s;
        }

        tr:hover{

            background:rgba(34,197,94,0.05);
        }

        /* BADGES */

        .badge{

            padding:7px 12px;

            border-radius:999px;

            font-size:12px;

            font-weight:900;

            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;

            min-width:90px;
        }

        .available{

            background:var(--accent-soft);

            color:var(--accent);
        }

        .notavailable{

            background:rgba(239,68,68,0.15);

            color:var(--danger);
        }

        .type-badge{

            background:rgba(96,165,250,.15);

            color:var(--info);
        }

        /* PRICE */

        .price{

            color:var(--accent);

            font-size:18px;

            font-weight:900;
        }

        .price small{

            color:var(--text-muted);

            font-size:11px;
        }

        /* COMPANY */

        .company-link{

            color:var(--info);

            font-weight:700;
        }

        .company-link:hover{

            text-decoration:underline;
        }

        /* ACTIONS */

        .actions{

            display:flex;

            justify-content:center;

            align-items:center;

            gap:12px;

            min-width:120px;
        }

        .action-btn{

            width:40px;

            height:40px;

            border-radius:12px;

            display:flex;

            justify-content:center;

            align-items:center;

            transition:.3s;

            flex-shrink:0;
        }

        .action-btn:hover{

            transform:translateY(-2px);
        }

        .edit{

            background:rgba(96,165,250,.14);

            color:var(--info);
        }

        .delete{

            background:rgba(239,68,68,.14);

            color:var(--danger);

            border:none;

            cursor:pointer;
        }

        /* MOBILE */

        @media(max-width:768px){

            .nav-links{
                display:none;
            }

            .top-bar{

                flex-direction:column;

                align-items:stretch;
            }

            .search-box{
                width:100%;
            }

            table{

                min-width:100%;
            }

            table,
            thead,
            tbody,
            th,
            td,
            tr{

                display:block;

                width:100%;
            }

            thead{

                display:none;
            }

            tr{

                margin:14px;

                border-radius:20px;

                padding:12px;

                background:
                        linear-gradient(
                        180deg,
                        #0b1220,
                        #020617);
            }

            td{

                display:flex;

                justify-content:space-between;

                align-items:center;

                border:none;

                padding:12px 10px;

                text-align:right;
            }

            td::before{

                content:attr(data-label);

                font-weight:800;

                color:var(--text-muted);

                text-align:left;
            }

            .actions{

                justify-content:flex-end;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">

        <img th:src="@{/images/rentify.png}"
             class="app-logo">

        <h2>
            Rent<span>ify</span>
        </h2>

    </div>

    <div class="nav-links">

        <a href="/rentify/">

            <i class="fa-solid fa-house"></i>

            Dashboard

        </a>

    </div>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- HEADER -->

    <div class="page-head">

        <h1>
            Cars 🚘
        </h1>

        <p>
            Manage all hourly rental cars in one place
        </p>

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                Total Cars
            </h3>

            <h2 th:text="${cars != null ? #lists.size(cars) : 0}">
                0
            </h2>

        </div>

    </div>

    <!-- ALERTS -->

    <div th:if="${success}"
         class="alert success"
         th:text="${success}"></div>

    <div th:if="${error}"
         class="alert error"
         th:text="${error}"></div>

    <!-- TOP BAR -->

    <div class="top-bar">

        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text"
                   id="searchInput"
                   placeholder="Search car model...">

        </div>

        <!-- ADD BUTTON -->

        <button class="btn-primary"
                onclick="location.href='/rentify/admin/car/new'">

            <i class="fa-solid fa-plus"></i>

            Add Car

        </button>

    </div>

    <!-- TABLE -->

    <div class="table-wrap">

        <table id="carTable">

            <thead>

            <tr>

                <th>ID</th>
                <th>Model</th>
                <th>Registration No</th>
                <th>Availability</th>
                <th>Car Type</th>
                <th>Price Per Hour</th>
                <th>Company</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="c : ${cars}">

                <td data-label="ID"
                    th:text="${c.id}">
                </td>

                <td data-label="Model">

                    <strong th:text="${c.model}"></strong>

                </td>

                <td data-label="Registration">

                    <span class="badge"
                          th:text="${c.registrationNo}">
                    </span>

                </td>

                <td data-label="Availability">

                    <span th:if="${c.available}"
                          class="badge available">

                        <i class="fa-solid fa-circle-check"></i>

                        Available

                    </span>

                    <span th:unless="${c.available}"
                          class="badge notavailable">

                        <i class="fa-solid fa-circle-xmark"></i>

                        Not Available

                    </span>

                </td>

                <td data-label="Car Type">

                    <span class="badge type-badge"
                          th:text="${c.type}">
                    </span>

                </td>

                <td data-label="Price">

                    <div class="price">

                        ₹<span th:text="${c.pricePerHour}"></span>

                        <small>/hour</small>

                    </div>

                </td>

                <td data-label="Company">

                    <a th:if="${c.company != null}"
                       th:text="${c.company.name}"
                       th:href="@{/rentify/admin/company/find/{id}(id=${c.company.id})}"
                       class="company-link">
                    </a>

                    <span th:if="${c.company == null}">
                        N/A
                    </span>

                </td>

                <td data-label="Actions">

                    <div class="actions">

                        <!-- EDIT -->

                        <a class="action-btn edit"
                           th:href="@{/rentify/admin/car/edit/{id}(id=${c.id})}">

                            <i class="fa-solid fa-pen-to-square"></i>

                        </a>

                        <!-- DELETE -->

                        <form th:action="@{/rentify/admin/car/delete/{id}(id=${c.id})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('Delete this car?')">

                            <input type="hidden"
                                   name="_method"
                                   value="DELETE">

                            <button type="submit"
                                    class="action-btn delete">

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- SEARCH SCRIPT -->

<script>

    document.getElementById(
        "searchInput"
    ).addEventListener(
        "keyup",
        function () {

            let value =
                this.value.toLowerCase();

            document.querySelectorAll(
                "#carTable tbody tr"
            ).forEach(row => {

                let model =
                    row.children[1]
                    .innerText
                    .toLowerCase();

                row.style.display =
                    model.includes(value)
                    ? ""
                    : "none";
            });
        }
    );

</script>

</body>

</html>
