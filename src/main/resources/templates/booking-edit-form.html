<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rentify | Edit Booking</title>

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        :root{
            --bg:#020617;
            --card:#0f172a;
            --card2:#111827;
            --border:rgba(255,255,255,.08);
            --text:#f8fafc;
            --muted:#94a3b8;
            --primary:#22c55e;
            --primaryDark:#16a34a;
            --primarySoft:rgba(34,197,94,.14);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:
                    radial-gradient(circle at top left,#1e293b 0%,#020617 45%);
            min-height:100vh;
            color:var(--text);
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        /* NAVBAR */

        .navbar{
            width:100%;
            padding:18px 32px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(2,6,23,.82);
            backdrop-filter:blur(18px);
            border-bottom:1px solid var(--border);
            position:sticky;
            top:0;
            z-index:999;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .app-logo{
            width:46px;
            height:46px;
            border-radius:14px;
        }

        .logo h2{
            font-size:26px;
            font-weight:900;
        }

        .logo span{
            color:var(--primary);
        }

        .nav-btn{
            padding:12px 18px;
            border-radius:14px;
            background:rgba(255,255,255,.05);
            border:1px solid var(--border);
            font-size:13px;
            font-weight:700;
            transition:.3s;
        }

        .nav-btn:hover{
            background:var(--primarySoft);
            color:var(--primary);
        }

        /* PAGE */

        .page{
            width:95%;
            max-width:650px;
            margin:45px auto;
        }

        .form-card{
            background:linear-gradient(180deg,#111827,#0b1120);
            border:1px solid var(--border);
            border-radius:32px;
            padding:34px;
            position:relative;
            overflow:hidden;
            box-shadow:0 25px 70px rgba(0,0,0,.45);
        }

        .form-card::before{
            content:"";
            position:absolute;
            width:240px;
            height:240px;
            border-radius:50%;
            background:rgba(34,197,94,.08);
            top:-120px;
            right:-90px;
        }

        .header{
            text-align:center;
            margin-bottom:28px;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 18px;
            border-radius:999px;
            background:rgba(255,255,255,.05);
            border:1px solid var(--border);
            color:var(--primary);
            font-size:13px;
            font-weight:700;
            margin-bottom:18px;
        }

        .header h1{
            font-size:34px;
            font-weight:900;
        }

        .header p{
            margin-top:10px;
            color:var(--muted);
            font-size:14px;
        }

        /* FORM */

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:13px;
            font-weight:700;
            color:#cbd5e1;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            left:16px;
            top:50%;
            transform:translateY(-50%);
            color:var(--muted);
            font-size:15px;
        }

        .input-box input,
        .input-box select{
            width:100%;
            height:58px;
            border-radius:18px;
            border:1px solid var(--border);
            background:#020617;
            color:white;
            padding:0 18px 0 48px;
            font-size:14px;
            outline:none;
            transition:.25s;
        }

        .input-box input:focus,
        .input-box select:focus{
            border-color:var(--primary);
            box-shadow:0 0 0 5px rgba(34,197,94,.12);
        }

        select option{
            background:#020617;
            color:white;
        }

        /* INFO CARD */

        .info-card{
            margin-top:22px;
            background:rgba(255,255,255,.04);
            border:1px solid var(--border);
            border-radius:22px;
            padding:20px;
        }

        .info-item{
            display:flex;
            justify-content:space-between;
            margin-bottom:14px;
            font-size:14px;
        }

        .info-item:last-child{
            margin-bottom:0;
        }

        .info-item span{
            color:var(--muted);
        }

        .info-item strong{
            color:white;
        }

        /* BUTTONS */

        .btn{
            width:100%;
            height:58px;
            border:none;
            border-radius:18px;
            cursor:pointer;
            font-size:15px;
            font-weight:800;
            transition:.3s;
        }

        .btn-update{
            margin-top:24px;
            background:linear-gradient(135deg,var(--primary),var(--primaryDark));
            color:#052e16;
            box-shadow:0 18px 45px rgba(34,197,94,.30);
        }

        .btn-update:hover{
            transform:translateY(-3px);
        }

        .btn-back{
            margin-top:14px;
            background:rgba(255,255,255,.05);
            border:1px solid var(--border);
            color:white;
        }

        .btn-back:hover{
            background:rgba(255,255,255,.08);
        }

        @media(max-width:700px){

            .navbar{
                padding:16px 18px;
            }

            .form-card{
                padding:24px;
            }

            .header h1{
                font-size:28px;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">

        <img th:src="@{/images/rentify.png}"
             class="app-logo">

        <h2>

            Rent<span>ify</span>

        </h2>

    </div>

    <a th:href="@{/rentify/}"
       class="nav-btn">

        <i class="fa-solid fa-house"></i>

        Dashboard

    </a>

</nav>

<!-- PAGE -->

<div class="page">

    <div class="form-card">

        <div class="header">

            <div class="badge">

                <i class="fa-solid fa-pen"></i>

                Edit Existing Booking

            </div>

            <h1>

                Update Booking

            </h1>

            <p>

                Modify booking timing, car selection and payment mode

            </p>

        </div>

        <form th:action="${#authorization.expression('hasRole(''ADMIN'')')}
                    ? @{/rentify/admin/booking/save}
                    : @{/rentify/user/booking/save}"
              th:object="${booking}"
              method="post">

            <!-- HIDDEN -->

            <input type="hidden"
                   th:field="*{id}">

            <input type="hidden"
                   th:field="*{customer.id}">

            <!-- START DATE TIME -->

            <div class="input-group">

                <label>

                    Start Date & Time (24 Hours)

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-calendar-check"></i>

                    <input type="datetime-local"
                           th:field="*{startDateTime}"
                           step="3600"
                           min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                           onchange="validateBookingTime()"
                           required>

                </div>

            </div>

            <!-- END DATE TIME -->

            <div class="input-group">

                <label>

                    End Date & Time (24 Hours)

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-calendar-xmark"></i>

                    <input type="datetime-local"
                           th:field="*{endDateTime}"
                           step="3600"
                           min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                           onchange="validateBookingTime()"
                           required>

                </div>

            </div>

            <!-- CAR -->

            <div class="input-group">

                <label>

                    Booked Car

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-car"></i>

                    <input type="text"
                           th:value="${booking.car.model}
                               + ' | '
                               + ${booking.car.registrationNo}
                               + ' | ₹'
                               + ${booking.car.pricePerHour}
                               + '/hour | '
                               + ${booking.car.type}"
                           readonly>

                </div>

            </div>

            <!-- HIDDEN CAR ID -->

            <input type="hidden" th:field="*{car.id}">

            <!-- PAYMENT -->

            <div class="input-group">

                <label>

                    Payment Mode

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-credit-card"></i>

                    <select th:field="*{payment.mode}"
                            required>

                        <option value="">

                            Select Payment Mode

                        </option>

                        <option th:each="pm :
                        ${T(com.rentify.carrental.enums.PaymentMode).values()}"
                                th:value="${pm}"
                                th:text="${pm}">

                        </option>

                    </select>

                </div>

            </div>

            <!-- INFO -->

            <div class="info-card">

                <div class="info-item">

                    <span>

                        Booking Type

                    </span>

                    <strong>

                        Hourly Rental

                    </strong>

                </div>

                <div class="info-item">

                    <span>

                        Time Format

                    </span>

                    <strong>

                        24 Hours

                    </strong>

                </div>

                <div class="info-item">

                    <span>

                        Billing

                    </span>

                    <strong>

                        Price Per Hour

                    </strong>

                </div>

            </div>

            <!-- BUTTON -->

            <button type="submit"
                    class="btn btn-update">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Booking

            </button>

        </form>

        <!-- BACK -->

        <a th:href="@{/rentify/}">

            <button class="btn btn-back">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </button>

        </a>

    </div>

</div>

<script>

    function validateBookingTime(){

        const start =
            document.querySelector('[name=\"startDateTime\"]').value;

        const end =
            document.querySelector('[name=\"endDateTime\"]').value;

        if(start && end){

            if(new Date(end) <= new Date(start)){

                alert('End time must be greater than start time');

            }
        }
    }

</script>

</body>

</html>
