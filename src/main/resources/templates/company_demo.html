<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Company Name</th>
                <th>Country</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${companies}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.country}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
