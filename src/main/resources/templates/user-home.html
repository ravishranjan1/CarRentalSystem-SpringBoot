<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify | User Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        :root{
            --bg-main:#020617;
            --bg-card:#0b1220;
            --border-soft:rgba(255,255,255,0.08);
            --text-main:#e5e7eb;
            --text-muted:#94a3b8;
            --accent:#22c55e;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        body{
            background:radial-gradient(circle at top,#111827,#020617);
            color:var(--text-main);
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        .navbar{
            background:rgba(2,6,23,.9);
            padding:14px 26px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo h2{
            font-weight:900;
        }

        .logo span{
            color:var(--accent);
        }

        .container{
            width:92%;
            max-width:1200px;
            margin:24px auto;
        }

        .hero{
            background:linear-gradient(135deg,#0f172a,#020617);
            border-radius:24px;
            padding:30px;
            border:1px solid rgba(255,255,255,0.08);
        }

        .hero h1{
            font-size:34px;
        }

        .hero p{
            margin-top:10px;
            color:var(--text-muted);
        }

        .actions{
            display:flex;
            gap:14px;
            margin-top:20px;
            flex-wrap:wrap;
        }

        .btn{
            padding:13px 18px;
            border-radius:14px;
            font-weight:800;
        }

        .btn-primary{
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:#022c16;
        }

        .btn-dark{
            background:rgba(255,255,255,0.08);
            color:white;
        }

        .section-title{
            margin:30px 0 14px;
        }

        .booking-table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:20px;
            background:#0b1220;
        }

        .booking-table th,
        .booking-table td{
            padding:14px;
            border-bottom:1px solid rgba(255,255,255,0.06);
            text-align:left;
        }

        .booking-table th{
            background:#111827;
        }

        .booking-table tr:hover{
            background:rgba(255,255,255,0.03);
        }
        .logout-btn{
            font-size:13px;
            padding:10px 16px;
            border-radius:14px;
            background:rgba(255,255,255,0.05);
            font-weight:700;
            transition:.3s;
            color:white;
            border:none;
            cursor:pointer;
        }
        .logout-btn:hover{
            background:rgba(239,68,68,0.2);
            color:#ef4444;
        }
        .nav-links{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .nav-links a{
            font-size:13px;
            padding:10px 16px;
            border-radius:14px;
            background:rgba(255,255,255,0.05);
            font-weight:700;
            transition:.3s;
            color:white;
        }

        .nav-links a:hover{
            background:rgba(34,197,94,0.18);
            color:#22c55e;
        }

        .logout-btn{
            font-size:13px;
            padding:10px 16px;
            border-radius:14px;
            background:rgba(255,255,255,0.05);
            font-weight:700;
            transition:.3s;
            color:white;
            border:none;
            cursor:pointer;
        }

        .logout-btn:hover{
            background:rgba(239,68,68,0.2);
            color:#ef4444;
        }

    </style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        <h2>Rent<span>ify</span></h2>
    </div>

    <div class="nav-links">
        <a th:href="@{'/rentify/profile/edit/' + ${customer.id}}">
            Edit Profile
        </a>
        <form th:action="@{/logout}"
              method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

</div>

<div class="container">

    <div class="hero">

        <h1>
            Welcome,
            <span th:text="${customer.name}">User</span>
            👋
        </h1>

        <p>
            View your previous bookings, rent cars and manage your profile.
        </p>

        <div class="actions">

            <a href="/rentify/user/booking/new"
               class="btn btn-primary">

                🚗 Book Car

            </a>

            <a href="/rentify/user/car/"
               class="btn btn-dark">

                Browse Cars

            </a>

        </div>

    </div>

    <div class="section-title">
        <h2>My Booking History</h2>
    </div>

    <table class="booking-table">

        <thead>
        <tr>
            <th>Booking Id</th>
            <th>Car</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Amount</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="booking : ${bookingList}">

            <td th:text="${booking.id}"></td>

            <td th:text="${booking.car.brand}"></td>

            <td th:text="${booking.startDate}"></td>

            <td th:text="${booking.endDate}"></td>

            <td th:text="${booking.totalAmount}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
